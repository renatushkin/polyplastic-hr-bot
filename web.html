<!doctype html><html lang="ru"><meta charset="utf-8"><title>Корсик — локальное демо</title>
<style>body{font:16px system-ui;max-width:950px;margin:30px auto;padding:15px;background:#f3f7fb}section{background:white;padding:20px;margin:15px 0;border-radius:12px}button,input,select{padding:10px;margin:5px}pre{white-space:pre-wrap} .msg{padding:8px;border-bottom:1px solid #ddd}</style>
<h1>Корсик: локальный прототип</h1><p>Это тестовый веб-чат, не интеграция с MAX. Данные синтетические. По умолчанию — поиск и цитирование без LLM.</p>
<section><select id="emp"><option>demo-gtp</option><option>demo-office</option></select><button id="refresh">Обновить</button><h3>Адаптация</h3><p id="step"></p><div id="buttons"></div><h3>Переписка</h3><div id="messages"></div><input id="question" placeholder="Задать вопрос"><button id="ask">Спросить</button><button id="ticket">Подтверждаю передачу вопроса HR</button><p id="status"></p></section>
<section><h2>Панель HR</h2><input id="token" type="password" placeholder="HR-токен из терминала"><button id="loadTickets">Загрузить обращения</button><div id="tickets"></div></section>
<script>
const el=id=>document.getElementById(id);let busy=false;
async function api(path,data,hr=false){let headers={'Content-Type':'application/json'};if(hr)headers['X-HR-Token']=el('token').value;let r=await fetch(path,{method:data?'POST':'GET',headers,body:data?JSON.stringify(data):undefined});let result=await r.json();if(!r.ok)throw Error(result.error);return result}
function render(s){el('step').textContent=s.step.text;el('buttons').replaceChildren();for(let label of s.step.buttons){let b=document.createElement('button');b.textContent=label;b.onclick=()=>act('step',label);el('buttons').append(b)}el('messages').replaceChildren();for(let m of s.messages){let d=document.createElement('div');d.className='msg';d.style.whiteSpace='pre-wrap';d.textContent=m.author+': '+m.text;el('messages').append(d)}}
async function refresh(){try{render(await api('/api/state?employee_id='+encodeURIComponent(el('emp').value)))}catch(e){el('status').textContent=e.message}}
async function act(action,text){if(busy)return;busy=true;try{let s=await api('/api/action',{employee_id:el('emp').value,action,text});render(s);el('status').textContent=s.ticket_id?'Обращение №'+s.ticket_id:'Готово'}catch(e){el('status').textContent=e.message}finally{busy=false}}
el('refresh').onclick=refresh;el('emp').onchange=refresh;el('ask').onclick=()=>act('question',el('question').value);el('ticket').onclick=()=>act('ticket',el('question').value);
el('loadTickets').onclick=async()=>{try{let list=await api('/api/tickets',null,true);el('tickets').replaceChildren();for(let t of list){let d=document.createElement('div'),p=document.createElement('p');p.textContent='#'+t.id+' '+t.employee_id+' — '+t.question+' ['+t.status+']';d.append(p);if(t.status==='open'){let input=document.createElement('input'),b=document.createElement('button');b.textContent='Ответить';b.onclick=async()=>{try{await api('/api/reply',{ticket_id:t.id,text:input.value},true);el('loadTickets').click();await refresh()}catch(e){alert(e.message)}};d.append(input,b)}el('tickets').append(d)}}catch(e){alert(e.message)}};refresh();
</script></html>
